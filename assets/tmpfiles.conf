# Shared avatar store. World-readable on purpose: the greeter runs as
# `greeter` and cannot read a user's mode-700 home, so ~/.face is useless to
# it. Populate with `qsgreet-set-avatar`.
d /var/cache/quickshell-greetd        0755 root root -
d /var/cache/quickshell-greetd/avatars 0755 root root -
